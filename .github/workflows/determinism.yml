name: determinism

on:
  push:
  workflow_dispatch:
    inputs:
      ticks:
        description: Ticks for the gate run (Node, Deno and Chrome, 4 threads)
        default: '1000000'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: unzip, for setup-deno; clang, lld and qemu-user, for the Pentium III build; openssl, for the relay
        run: apt-get update && apt-get install -y --no-install-recommends unzip clang lld qemu-user openssl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: npm ci
      - run: npm i --no-save playwright-core@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - run: npm test
      - name: Node, Deno and Chrome x both JIT tiers x 1, 2, 4 threads, and the Xbox's Pentium III build (native and under qemu)
        run: node harness/matrix.mjs --ticks 20000 --runtimes node,deno,chromium,x86,pentium3
      - name: The same for a match four golf bots play
        run: |
          node tools/gengame.mjs --course 8 --bots 4 --ticks 20000 --out logs/game.qgl
          node harness/matrix.mjs --ticks 20000 --log logs/game.qgl --runtimes node,deno,chromium,x86,pentium3
      - name: M4's pit, 10,000 balls heaped and a grenade into them
        run: |
          node tools/genlog.mjs --pit --out logs/pit.qgl
          node harness/matrix.mjs --ticks 9000 --log logs/pit.qgl --runtimes node,deno,chromium,x86,pentium3
      - name: Xbox clients online (the relay, a native client and a late one under qemu, impaired, a flipped bit healed)
        run: node net/run-x2.mjs --chrome 0 --seconds 40 --late 10 --flip 20
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: traces/

  xbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: nxdk's toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm make cmake flex bison git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .tools/nxdk
          key: nxdk-${{ hashFiles('tools/install-nxdk.sh') }}
      - run: sh tools/install-nxdk.sh
      - name: The XBE and a bootable ISO
        run: make -C xbox -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: quake-golf-xbox
          path: |
            xbox/bin/default.xbe
            xbox/*.iso

  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: unzip, for setup-deno
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: npm ci
      - run: npm i --no-save playwright-core@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - run: node harness/matrix.mjs --ticks ${{ inputs.ticks }} --flags default --threads 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-traces
          path: traces/*.qgh
